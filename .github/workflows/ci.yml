name: GoHealthTrip CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gohealthtrip?schema=public"
      NEXTAUTH_SECRET: "ght_ci_test_secret_32_bytes_long_string"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Validate Prisma Schema
      run: npx prisma validate

    - name: Build Next.js Fullstack Platform
      run: npm run build
